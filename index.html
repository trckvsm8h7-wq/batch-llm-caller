<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLM batch caller</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fb;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #64748b;
      --border: #d9e0ea;
      --accent: #0f766e;
      --accent-hover: #115e59;
      --error: #b91c1c;
      --shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }

    main {
      width: min(720px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0;
    }

    h1 {
      margin: 0 0 24px;
      font-size: 2rem;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 24px;
    }

    .field {
      display: grid;
      gap: 8px;
      margin-bottom: 20px;
    }

    label {
      font-weight: 650;
    }

    textarea,
    input[type="text"],
    input[type="file"] {
      width: 100%;
      color: var(--text);
      font: inherit;
    }

    textarea,
    input[type="text"] {
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      padding: 12px;
      transition: border-color 120ms ease, box-shadow 120ms ease;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    textarea:focus,
    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.14);
      outline: none;
    }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-top: 8px;
    }

    button {
      min-height: 42px;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      padding: 10px 18px;
      transition: background 120ms ease, transform 120ms ease;
    }

    button:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    button:active:not(:disabled) {
      transform: translateY(1px);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.62;
    }

    #downloadButton {
      display: none;
      background: #334155;
    }

    #downloadButton:hover {
      background: #1e293b;
    }

    .status {
      min-height: 28px;
      margin-top: 20px;
      color: var(--muted);
      font-weight: 600;
    }

    .status.error {
      color: var(--error);
    }

    .results {
      display: grid;
      gap: 14px;
      margin-top: 24px;
    }

    .result-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      padding: 16px;
    }

    .result-header {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 700;
    }

    .result-block {
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .result-label {
      display: block;
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    @media (max-width: 520px) {
      main {
        width: min(100% - 24px, 720px);
        padding: 28px 0;
      }

      .panel {
        padding: 18px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>LLM batch caller</h1>

    <section class="panel">
      <div class="field">
        <label for="systemPrompt">System prompt</label>
        <textarea id="systemPrompt" placeholder="Paste the system prompt here"></textarea>
      </div>

      <div class="field">
        <label for="promptFile">Prompt file</label>
        <input id="promptFile" type="file" accept=".txt,.csv,.jpg,.jpeg,.png,text/plain,text/csv,image/jpeg,image/png">
        <p class="hint">Use a text or CSV file with one prompt per line.</p>
      </div>

      <div class="field">
        <label for="apiUrl">API URL</label>
        <input id="apiUrl" type="text" value="http://localhost:1234/v1/chat/completions">
      </div>

      <div class="field">
        <label for="apiKey">API Key</label>
        <input id="apiKey" type="password">
      </div>

      <div class="field">
        <label for="modelName">Model name</label>
        <input id="modelName" type="text" value="qwen3.5-0.8b" placeholder="qwen3.5-0.8b (LM Studio), qwen2.5-vl-7b (LM Studio vision), gemini-2.5-flash (Google AI Studio), meta-llama/llama-3.3-70b-instruct:free (OpenRouter), qwen/qwen2.5-vl-72b-instruct:free (OpenRouter vision)">
      </div>

      <div class="actions">
        <button id="runButton" type="button">Run</button>
        <button id="downloadButton" type="button">Download CSV</button>
      </div>

      <div id="status" class="status" aria-live="polite">Choose a file to begin.</div>
      <div id="results" class="results" aria-live="polite"></div>
    </section>
  </main>

  <script>
    const systemPromptInput = document.getElementById("systemPrompt");
    const promptFileInput = document.getElementById("promptFile");
    const apiUrlInput = document.getElementById("apiUrl");
    const apiKeyInput = document.getElementById("apiKey");
    const modelNameInput = document.getElementById("modelName");
    const runButton = document.getElementById("runButton");
    const downloadButton = document.getElementById("downloadButton");
    const statusArea = document.getElementById("status");
    const resultsArea = document.getElementById("results");

    let results = [];
    let runStartedAt = 0;

    function setStatus(message, isError = false) {
      statusArea.textContent = message;
      statusArea.classList.toggle("error", isError);
    }

    function readFileAsText(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ""));
        reader.onerror = () => reject(new Error("Could not read the selected file."));
        reader.readAsText(file);
      });
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ""));
        reader.onerror = () => reject(new Error("Could not read the selected image."));
        reader.readAsDataURL(file);
      });
    }

    function parsePromptLines(text) {
      return text
        .replace(/^\uFEFF/, "")
        .split(/\r?\n/)
        .map((line) => line.replace(/\r$/, ""))
        .filter((line) => line.trim().length > 0);
    }

    function getTestPrompts() {
      const params = new URLSearchParams(window.location.search);
      const encodedPrompts = params.get("test_prompts");

      return encodedPrompts ? parsePromptLines(encodedPrompts) : [];
    }

    function isImageFile(file) {
      return Boolean(file && (
        file.type === "image/jpeg" ||
        file.type === "image/png" ||
        /\.(jpe?g|png)$/i.test(file.name)
      ));
    }

    async function callChatCompletion(messages, modelName, apiUrl, apiKey) {
      let response;
      const headers = {
        "Content-Type": "application/json"
      };

      if (apiKey) {
        headers.Authorization = `Bearer ${apiKey}`;
      }

      try {
        response = await fetch(apiUrl, {
          method: "POST",
          headers,
          body: JSON.stringify({
            model: modelName,
            messages
          })
        });
      } catch (error) {
        throw new Error(
          `Could not reach the API at ${apiUrl}. Check the URL, server, and browser access.`
        );
      }

      const responseText = await response.text();
      let data;

      try {
        data = responseText ? JSON.parse(responseText) : {};
      } catch (error) {
        throw new Error(response.ok ? "The API returned invalid JSON." : responseText);
      }

      if (!response.ok) {
        const message = data.error && data.error.message ? data.error.message : responseText;
        throw new Error(message || `Request failed with status ${response.status}.`);
      }

      if (!data.choices || !data.choices[0] || !data.choices[0].message) {
        throw new Error("The API response did not include a chat message.");
      }

      return data.choices[0].message.content || data.choices[0].message.reasoning_content || "";
    }

    async function callModel(systemPrompt, userPrompt, modelName, apiUrl, apiKey) {
      return callChatCompletion([
        { role: "system", content: systemPrompt },
        { role: "user", content: userPrompt }
      ], modelName, apiUrl, apiKey);
    }

    async function callImageModel(userText, imageDataUrl, modelName, apiUrl, apiKey) {
      return callChatCompletion([
        {
          role: "user",
          content: [
            { type: "text", text: userText },
            { type: "image_url", image_url: { url: imageDataUrl } }
          ]
        }
      ], modelName, apiUrl, apiKey);
    }

    function renderResult(result) {
      const card = document.createElement("article");
      card.className = "result-card";

      const header = document.createElement("p");
      header.className = "result-header";
      header.textContent = `Row ${result.row_number}`;

      const inputLabel = document.createElement("span");
      inputLabel.className = "result-label";
      inputLabel.textContent = "Input";

      const inputText = document.createElement("p");
      inputText.className = "result-block";
      inputText.textContent = result.input;

      const responseLabel = document.createElement("span");
      responseLabel.className = "result-label";
      responseLabel.textContent = "Response";

      const responseText = document.createElement("p");
      responseText.className = "result-block";
      responseText.textContent = result.response;

      card.append(header, inputLabel, inputText, responseLabel, responseText);
      resultsArea.appendChild(card);
    }

    function escapeCsvField(value) {
      const text = String(value == null ? "" : value);
      const escaped = text.replace(/"/g, '""');
      return /[",\r\n]/.test(escaped) ? `"${escaped}"` : escaped;
    }

    function buildCsv(rows) {
      const header = ["row_number", "input", "response"];
      const lines = [
        header.map(escapeCsvField).join(","),
        ...rows.map((row) => [
          row.row_number,
          row.input,
          row.response
        ].map(escapeCsvField).join(","))
      ];

      return lines.join("\r\n");
    }

    function downloadResults() {
      const csv = buildCsv(results);
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = "results.csv";
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    async function runBatch() {
      const file = promptFileInput.files[0];
      const apiUrl = apiUrlInput.value.trim();
      const apiKey = apiKeyInput.value.trim();
      const modelName = modelNameInput.value.trim();
      const testPrompts = getTestPrompts();

      if (!file && testPrompts.length === 0) {
        setStatus("Choose a .txt or .csv file first.", true);
        return;
      }

      if (!modelName) {
        setStatus("Enter a model name before running.", true);
        return;
      }

      if (!apiUrl) {
        setStatus("Enter an API URL before running.", true);
        return;
      }

      runButton.disabled = true;
      downloadButton.style.display = "none";
      results = [];
      resultsArea.textContent = "";
      runStartedAt = Date.now();

      try {
        if (file && isImageFile(file)) {
          setStatus("Processing image...");

          const imageDataUrl = await readFileAsDataUrl(file);
          const imagePrompt = systemPromptInput.value.trim() || "Transcribe this image as accurately as you can.";
          let responseText;

          try {
            responseText = await callImageModel(imagePrompt, imageDataUrl, modelName, apiUrl, apiKey);
          } catch (error) {
            responseText = error && error.message ? `Error: ${error.message}` : "Error: Request failed.";
          }

          const result = {
            row_number: 1,
            input: file.name,
            response: responseText
          };

          results.push(result);
          renderResult(result);

          const elapsedSeconds = Math.max(1, Math.round((Date.now() - runStartedAt) / 1000));
          setStatus(`Done. Processed 1 image in ${elapsedSeconds}s.`);
          downloadButton.style.display = "inline-flex";
          return;
        }

        const text = file ? await readFileAsText(file) : "";
        const prompts = file ? parsePromptLines(text) : testPrompts;

        if (prompts.length === 0) {
          setStatus("The selected file has no prompt lines.", true);
          return;
        }

        for (let index = 0; index < prompts.length; index += 1) {
          const rowNumber = index + 1;
          const input = prompts[index];
          let responseText;

          setStatus(`Processing row ${rowNumber} of ${prompts.length}...`);

          try {
            responseText = await callModel(systemPromptInput.value, input, modelName, apiUrl, apiKey);
          } catch (error) {
            responseText = error && error.message ? `Error: ${error.message}` : "Error: Request failed.";
          }

          const result = {
            row_number: rowNumber,
            input,
            response: responseText
          };

          results.push(result);
          renderResult(result);
          setStatus(`Processed ${rowNumber} of ${prompts.length}.`);
        }

        const elapsedSeconds = Math.max(1, Math.round((Date.now() - runStartedAt) / 1000));
        setStatus(`Done. Processed ${results.length} row${results.length === 1 ? "" : "s"} in ${elapsedSeconds}s.`);
        downloadButton.style.display = "inline-flex";
      } catch (error) {
        setStatus(error && error.message ? error.message : "Something went wrong.", true);
      } finally {
        runButton.disabled = false;
      }
    }

    runButton.addEventListener("click", runBatch);
    downloadButton.addEventListener("click", downloadResults);
  </script>
</body>
</html>
